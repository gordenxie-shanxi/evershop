"""
Represents a coupon
"""
type Coupon {
  couponId: Int
  uuid: String!
  status: Int!
  description: String!
  discountAmount: Float!
  freeShipping: Int!
  discountType: String!
  coupon: String!
  usedTime: Int
  targetProducts: TargetProducts
  condition: OrderCondition
  userCondition: UserCondition
  buyxGety: [ByXGetY]
  maxUsesTimePerCoupon: Int
  maxUsesTimePerCustomer: Int
  startDate: DateTime
  endDate: DateTime
  editUrl: String!
  updateApi: String!
  deleteApi: String!
  stackingRule: String
  spendTiers: [SpendTier]
}

"""
Represents a signle product used in the condition of a coupon.
"""
type MatchProductFilter {
  key: String!
  operator: String!
  value: JSON
  qty: String
}

"""
Represents the target products of a coupon.
"""
type TargetProducts {
  maxQty: String
  products: [MatchProductFilter]
}

"""
Represents the condition of a coupon.
"""
type OrderCondition {
  orderTotal: String
  orderQty: String
  requiredProducts: [MatchProductFilter]
}

"""
Represents the buy x get y condition of a coupon.
"""
type ByXGetY {
  sku: String!
  buyQty: String
  getQty: String
  maxY: String
  discount: String
}

"""
Represents the user condition of a coupon.
"""
type UserCondition {
  groups: [String]
  emails: [String]
  purchased: String
}

"""
Returns a collection of coupons
"""
type CouponCollection {
  items: [Coupon]
  currentPage: Int!
  total: Int!
  currentFilters: [Filter]
}

extend type Query {
  coupon(id: Int): Coupon
  coupons(filters: [FilterInput]): CouponCollection
}

"""
Spend tier for spend-and-save coupons
"""
type SpendTier {
  minAmount: Float!
  discountAmount: Float!
}

"""
Represents a promotion (e.g. spend_and_save, second_item_discount, limited_time_special)
"""
type Promotion {
  promotionId: Int
  uuid: String!
  name: String!
  description: String
  status: Int!
  type: String!
  priority: Int!
  startDate: DateTime
  endDate: DateTime
  conditions: JSON
  actions: JSON
  editUrl: String!
  updateApi: String!
  deleteApi: String!
}

"""
Returns a collection of promotions
"""
type PromotionCollection {
  items: [Promotion]
  currentPage: Int!
  total: Int!
  currentFilters: [Filter]
}

"""
Describes a conflict detected between active promotions / coupons
"""
type PromotionConflict {
  type: String!
  severity: String!
  message: String!
  affectedIds: [String]
}

extend type Query {
  promotion(id: String): Promotion
  promotions(filters: [FilterInput]): PromotionCollection
  promotionConflicts: [PromotionConflict]
}

extend type Mutation {
  createPromotion(
    name: String!
    description: String
    status: Int
    type: String!
    priority: Int
    startDate: String
    endDate: String
    conditions: JSON
    actions: JSON
  ): Promotion

  updatePromotion(
    id: String!
    name: String
    description: String
    status: Int
    type: String
    priority: Int
    startDate: String
    endDate: String
    conditions: JSON
    actions: JSON
  ): Promotion

  deletePromotion(id: String!): Boolean
}
